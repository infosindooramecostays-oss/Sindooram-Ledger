<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sindooram ID">
<meta name="theme-color" content="#5b52d6">
<title>Sindooram ID</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta property="og:title" content="Sindooram ID">
<meta property="og:description" content="Capture and store guest ID documents per booking">
<style>
:root{
  color-scheme: light;
  --page:#f2f2f6;
  --surface:#ffffff;
  --surface-2:#f2f2f9;
  --text-primary:#100f1a;
  --text-secondary:#65647a;
  --text-muted:#9694a8;
  --grid:#e9e8f3;
  --border:rgba(20,15,50,0.08);
  --shadow-1:0 1px 2px rgba(20,10,50,.04), 0 14px 28px -18px rgba(20,10,60,.28);
  --good:#0ca30c;
  --warning:#fab219;
  --critical:#d03b3b;
  --accent:#6d5ef8;
  --accent-2:#ec4899;
  --brand-a:#4c3fd7;
  --brand-b:#8b3fea;
  --brand-c:#ec4899;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0f0e14;
    --surface:#1a1822;
    --surface-2:#232131;
    --text-primary:#f6f5fa;
    --text-secondary:#ada9c2;
    --text-muted:#7d7a91;
    --grid:#2c2a36;
    --border:rgba(255,255,255,0.09);
    --shadow-1:0 0 0 1px rgba(255,255,255,.04), 0 14px 30px -14px rgba(0,0,0,.7);
    --accent:#8b7bff;
    --accent-2:#f472b6;
    --brand-a:#5b3df0;
    --brand-b:#9d4de0;
    --brand-c:#f472b6;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background:
    radial-gradient(900px 520px at 10% -12%, rgba(109,94,248,0.16), transparent 60%),
    radial-gradient(800px 520px at 100% 10%, rgba(236,72,153,0.12), transparent 60%),
    var(--page);
  background-attachment: fixed;
  color:var(--text-primary);
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea{ font-family: inherit; }
button{ transition: background-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease, border-color .15s ease; }
input, select, textarea{ transition: border-color .15s ease, box-shadow .15s ease; }
input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(109,94,248,.2); }

.topbar{
  position:sticky; top:0; z-index:20;
  background: linear-gradient(135deg, var(--brand-a) 0%, var(--brand-b) 55%, var(--brand-c) 100%);
  padding:16px 16px 14px;
  padding-top:calc(16px + env(safe-area-inset-top));
  text-align:center;
  box-shadow:0 4px 24px -8px rgba(76,63,215,.45);
}
.hero-brand{ color:#fff; font-size:19px; font-weight:800; }
.hero-tagline{ color:rgba(255,255,255,.85); font-size:12.5px; margin-top:2px; }
.topbar-title{
  display:inline-block; margin-top:11px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  color:#fff; background:rgba(255,255,255,.2); padding:4px 13px; border-radius:999px;
}
.conn-status{
  margin:8px auto 0; font-size:10.5px; color:rgba(255,255,255,.88); display:flex; align-items:center; justify-content:center;
  gap:5px; background:rgba(255,255,255,.12); border:0; border-radius:999px; padding:5px 12px; cursor:pointer;
}
.conn-status:hover{ background:rgba(255,255,255,.2); }
.conn-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; flex:none; }
.conn-dot-live{ background:#3ddc71; box-shadow:0 0 0 3px rgba(61,220,113,.3); }
.conn-dot-syncing{ background:#ffd166; }
.conn-dot-error{ background:#ff6b6b; }
.conn-dot-off{ background:rgba(255,255,255,.45); }
.help-btn{
  position:absolute; top:calc(14px + env(safe-area-inset-top)); right:14px;
  width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.18); border:0; color:#fff;
  font-size:15px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.help-btn:hover{ background:rgba(255,255,255,.3); }

.tour-overlay{ position:fixed; inset:0; background:rgba(10,8,20,.6); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; }
.tour-overlay[hidden]{ display:none; }
.tour-card{ background:var(--surface); border-radius:22px; padding:26px 22px 22px; max-width:380px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.4); text-align:center; }
.tour-lang-toggle{ display:flex; justify-content:center; gap:6px; margin-bottom:14px; }
.tour-lang-btn{ border:1.5px solid var(--border); background:var(--surface-2); color:var(--text-secondary); font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:999px; cursor:pointer; }
.tour-lang-btn.active{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border-color:transparent; }
.tour-step-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin-bottom:10px; }
.tour-title{ font-size:17px; font-weight:800; margin:0 0 10px; }
.tour-body{ font-size:14.5px; line-height:1.7; color:var(--text-secondary); margin:0 0 18px; }
.tour-dots{ display:flex; justify-content:center; gap:6px; margin-bottom:18px; }
.tour-dot{ width:7px; height:7px; border-radius:50%; background:var(--border); }
.tour-dot.active{ background:var(--accent); width:18px; border-radius:4px; }
.tour-actions{ display:flex; gap:10px; }
.tour-actions .btn-secondary, .tour-actions .btn-primary{ flex:1; padding:12px 14px; font-size:13.5px; }

#app{ max-width:600px; margin:0 auto; padding:16px 14px 100px; }
.tab{ display:none; }
.tab.active{ display:block; animation:fadeIn .2s ease; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:17px; margin-bottom:12px; box-shadow:var(--shadow-1); }
.card-title{ margin:0 0 10px; font-size:14px; font-weight:700; }
.empty-hint{ color:var(--text-muted); font-size:13px; margin:4px 0; }

.field-group{ margin-bottom:14px; }
.field-label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
.field-optional{ font-weight:400; color:var(--text-muted); font-size:11.5px; }
.field-input{ display:block; width:100%; max-width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text-primary); font-size:15.5px; font-weight:500; }
input[type="date"].field-input{ -webkit-appearance:none; appearance:none; }
textarea.field-input{ resize:vertical; min-height:64px; }

.upload-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
.upload-btn{
  flex:1 1 90px; display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 8px;
  border-radius:16px; border:1.5px dashed var(--border); background:var(--surface-2); color:var(--text-primary);
  font-size:12.5px; font-weight:600; cursor:pointer; text-align:center;
}
.upload-btn:hover{ border-color:var(--accent); color:var(--accent); }
.upload-btn svg{ color:var(--accent); }

.upload-list{ margin-top:4px; }
.upload-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--grid); font-size:13.5px; }
.upload-row:last-child{ border-bottom:0; }
.upload-row .name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.upload-status{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; flex:none; }
.upload-status.uploading{ background:rgba(250,178,25,.2); color:#8a5c00; }
.upload-status.done{ background:rgba(12,163,12,.15); color:var(--good); }
.upload-status.failed{ background:rgba(208,59,59,.15); color:var(--critical); }
.remove-pending-btn{ background:none; border:0; color:var(--critical); font-size:12px; font-weight:700; cursor:pointer; padding:4px 8px; flex:none; }
.remove-pending-btn:hover{ text-decoration:underline; }
.view-link{ color:var(--accent); font-size:12px; font-weight:700; text-decoration:none; padding:4px 8px; flex:none; }
.view-link:hover{ text-decoration:underline; }
.upload-meta{ font-size:11px; color:var(--text-muted); flex:none; white-space:nowrap; }
.btn-primary:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; }

.detail-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid var(--grid); font-size:14px; }
.detail-row:last-of-type{ border-bottom:0; }
.detail-label{ color:var(--text-secondary); font-weight:600; flex:none; }
.detail-value{ color:var(--text-primary); font-weight:700; text-align:right; }

.booking-list .booking-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin-bottom:10px; cursor:pointer; box-shadow:var(--shadow-1); transition:transform .15s ease, box-shadow .15s ease; }
.booking-list .booking-card:hover{ transform:translateY(-2px); }
.booking-card-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
.booking-guest{ font-size:15px; font-weight:700; }
.badge{ font-size:11px; padding:3px 9px; border-radius:999px; font-weight:700; flex:none; background:var(--surface-2); color:var(--text-secondary); }
.booking-meta{ font-size:12px; color:var(--text-muted); margin-top:4px; }
.booking-dates{ font-size:13px; margin-top:7px; font-weight:600; }

.cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.cal-nav-btn{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-primary); width:34px; height:34px; border-radius:50%; font-size:16px; font-weight:700; cursor:pointer; }
.cal-nav-btn:hover{ border-color:var(--accent); color:var(--accent); }
.cal-title{ font-size:15px; font-weight:800; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-weekday{ text-align:center; font-size:10.5px; font-weight:700; color:var(--text-muted); padding:4px 0 8px; }
.cal-day{ position:relative; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:12px; font-size:13px; font-weight:600; cursor:pointer; background:var(--surface-2); border:1.5px solid transparent; }
.cal-day.empty{ visibility:hidden; cursor:default; }
.cal-day.has-booking{ background:linear-gradient(135deg, rgba(109,94,248,.16), rgba(236,72,153,.16)); color:var(--accent); }
.cal-day.today{ border-color:var(--accent); }
.cal-day.selected{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; }
.cal-dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); }
.cal-day.selected .cal-dot{ background:#fff; }
.cal-day-list{ margin-top:16px; }

.bottomnav{
  position:fixed; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:30;
  display:flex; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:26px;
  box-shadow:0 12px 32px -10px rgba(20,10,5,.28); padding:6px 6px;
}
.navbtn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 0 8px; background:none; border:0; color:var(--text-secondary); font-size:10.5px; font-weight:600; cursor:pointer; border-radius:18px; }
.navbtn:hover:not(.active){ color:var(--text-primary); background:var(--surface-2); }
.navbtn.active{ color:var(--accent); background:linear-gradient(135deg, rgba(109,94,248,.14), rgba(236,72,153,.14)); }
.navbtn svg{ display:block; }

.btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border:0; padding:13px 20px; border-radius:999px; font-weight:700; font-size:14px; cursor:pointer; }
.btn-primary:hover{ box-shadow:0 8px 20px -6px rgba(109,94,248,.55); }
.btn-secondary{ background:var(--surface-2); color:var(--text-primary); border:1px solid var(--border); padding:13px 20px; border-radius:999px; font-weight:600; font-size:14px; cursor:pointer; }
.btn-secondary:hover{ background:var(--grid); border-color:var(--accent); }
.settings-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:2px; }
.sync-status{ font-size:12.5px; color:var(--text-muted); margin-top:10px; }

details.card summary{ cursor:pointer; font-weight:700; font-size:14px; list-style:none; }
details.card summary::-webkit-details-marker{ display:none; }
details.card summary::after{ content:'+'; float:right; font-weight:400; }
details.card[open] summary::after{ content:'−'; }
.guide-body{ margin-top:12px; font-size:13.5px; line-height:1.55; }
.guide-body ol{ padding-left:20px; margin:8px 0; }
.guide-body li{ margin-bottom:6px; }
.code-block{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px; font-size:11px; overflow-x:auto; white-space:pre; margin:10px 0; }
.guide-note{ background:var(--surface-2); border-left:3px solid var(--accent); padding:8px 10px; border-radius:8px; font-size:12.5px; margin:10px 0; }
.copy-btn{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-primary); font-size:12px; padding:7px 12px; border-radius:999px; cursor:pointer; }

.empty-state{ background:var(--surface); border:1.5px dashed var(--border); border-radius:24px; padding:34px 20px; text-align:center; }
.empty-state-icon{ width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg, rgba(109,94,248,.16), rgba(236,72,153,.16)); color:var(--accent); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.empty-state .btn-primary{ margin-top:14px; }

#toast{
  position:fixed; left:50%; bottom:96px; transform:translate(-50%,10px);
  background:var(--text-primary); color:var(--page); padding:12px 20px; border-radius:999px;
  font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60;
  box-shadow:0 10px 28px rgba(0,0,0,.3);
}
#toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<header class="topbar">
  <div class="hero-brand">Sindooram ID</div>
  <div class="hero-tagline">Guest ID &amp; document capture for the villa</div>
  <div class="topbar-title" id="topbarTitle">Bookings</div>
  <button type="button" class="conn-status" id="connStatus" data-action="refresh-now" aria-label="Tap to refresh"><span class="conn-dot conn-dot-off"></span>Not connected</button>
  <button type="button" class="help-btn" data-action="open-tour" aria-label="Quick tour">?</button>
</header>

<main id="app">
  <section id="tab-bookings" class="tab active"></section>
  <section id="tab-calendar" class="tab"></section>
  <section id="tab-settings" class="tab"></section>
</main>

<nav class="bottomnav">
  <button class="navbtn active" data-action="switch-tab" data-tab="bookings">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
    Bookings
  </button>
  <button class="navbtn" data-action="switch-tab" data-tab="calendar">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/><circle cx="8" cy="14" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="14" r="1.3" fill="currentColor" stroke="none"/></svg>
    Calendar
  </button>
  <button class="navbtn" data-action="switch-tab" data-tab="settings">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.6V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.6 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.6 1z"/></svg>
    Settings
  </button>
</nav>

<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="docInput" accept=".pdf,.doc,.docx,application/pdf,application/msword" multiple hidden>

<div id="toast"></div>

<div id="confirmOverlay" class="tour-overlay" hidden>
  <div class="tour-card">
    <p class="tour-body" id="confirmMessage" style="margin-bottom:20px;"></p>
    <div class="tour-actions">
      <button type="button" class="btn-secondary" data-action="confirm-cancel">Cancel</button>
      <button type="button" class="btn-primary" id="confirmOkBtn" data-action="confirm-yes">Yes</button>
    </div>
  </div>
</div>

<div id="tourOverlay" class="tour-overlay" hidden>
  <div class="tour-card">
    <div class="tour-lang-toggle">
      <button type="button" class="tour-lang-btn active" data-action="tour-lang" data-lang="ml">മലയാളം</button>
      <button type="button" class="tour-lang-btn" data-action="tour-lang" data-lang="en">English</button>
    </div>
    <div class="tour-step-label" id="tourStepLabel"></div>
    <h3 class="tour-title" id="tourTitle"></h3>
    <p class="tour-body" id="tourBody"></p>
    <div class="tour-dots" id="tourDots"></div>
    <div class="tour-actions">
      <button type="button" class="btn-secondary" data-action="tour-skip">ഒഴിവാക്കുക</button>
      <button type="button" class="btn-primary" id="tourNextBtn" data-action="tour-next">അടുത്തത്</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ---------- Constants ---------- */
var LS_KEYS = { settings:'idvault_settings_v1', cache:'idvault_cache_v1' };
var APPS_SCRIPT_CODE =
'// ===== Sindooram ID Vault — Apps Script =====\n' +
'// A separate, standalone script from the main Ledger one. It only reads\n' +
'// booking basics (no money, status, or guest contact fields) from the\n' +
'// Ledger Sheet, and saves uploaded documents to Drive. Deploy this as its\n' +
'// own Web App with its own URL — do not reuse the Ledger\'s URL, since\n' +
'// that one exposes full financial data.\n\n' +
'// Paste your Ledger Google Sheet\'s ID here — open the Ledger Sheet, look\n' +
'// at its URL: https://docs.google.com/spreadsheets/d/THIS_PART/edit\n' +
'var LEDGER_SHEET_ID = \'1aUJV7OZzxd9Bzwjr18SbsfYiDIp95nlAk1XhrXOcK34\';\n\n' +
'// The Drive folder everything gets saved under. Created automatically the\n' +
'// first time anyone uploads a document — nothing to set up by hand.\n' +
'var VAULT_FOLDER_NAME = \'Sindooram ID Vault\';\n\n' +
'// Handles GET requests: returns recent bookings for the picker, or (when\n' +
'// called with ?bookingNumber=...) the documents already on file for one\n' +
'// specific booking, so the app can show what\'s already been uploaded.\n' +
'function doGet(e) {\n' +
'  var bookingNumber = e && e.parameter && e.parameter.bookingNumber;\n' +
'  if (bookingNumber) {\n' +
'    return jsonResponse({ uploads: getUploadsForBooking(bookingNumber) });\n' +
'  }\n' +
'  return jsonResponse({ bookings: getRecentBookings() });\n' +
'}\n\n' +
'// Handles POST requests: saves one uploaded file and logs it, or (action\n' +
'// \'deleteUpload\') removes a file someone just uploaded by mistake.\n' +
'function doPost(e) {\n' +
'  var data = JSON.parse(e.postData.contents);\n' +
'  if (data.action === \'deleteUpload\') {\n' +
'    try { return jsonResponse(deleteUpload(data)); }\n' +
'    catch (err) { return jsonResponse({ error: String(err.message || err) }); }\n' +
'  }\n' +
'  try { return jsonResponse(saveUpload(data)); }\n' +
'  catch (err) { return jsonResponse({ error: String(err.message || err) }); }\n' +
'}\n\n' +
'function jsonResponse(obj) {\n' +
'  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n' +
'}\n\n' +
'// Only what the manager needs to identify a booking — no amount, status,\n' +
'// source, or guest contact details are ever read or returned. Status is\n' +
'// read only to filter to Confirmed bookings; it\'s never included in what\n' +
'// gets sent back.\n' +
'function getRecentBookings() {\n' +
'  var sheet = SpreadsheetApp.openById(LEDGER_SHEET_ID).getSheetByName(\'Bookings\');\n' +
'  if (!sheet) return [];\n' +
'  var values = sheet.getDataRange().getValues();\n' +
'  if (values.length < 2) return [];\n' +
'  var headers = values[0];\n' +
'  var col = {};\n' +
'  headers.forEach(function (h, i) { col[h] = i; });\n' +
'  var rows = values.slice(1).filter(function (row) {\n' +
'    if (row[0] === \'\' || row[0] === null) return false;\n' +
'    return String(row[col[\'Status\']] || \'\').trim().toLowerCase() === \'confirmed\';\n' +
'  });\n' +
'  // Drop bookings that are already over. Uses check-out (falling back to\n' +
'  // check-in if there\'s no check-out) against "today" in India time —\n' +
'  // the business\'s timezone — regardless of what timezone this script\n' +
'  // project happens to be set to.\n' +
'  var todayIndia = Utilities.formatDate(new Date(), \'Asia/Kolkata\', \'yyyy-MM-dd\');\n' +
'  rows = rows.filter(function (row) {\n' +
'    var relevant = cleanText(row[col[\'Check-out\']]) || cleanText(row[col[\'Check-in\']]);\n' +
'    return !relevant || relevant >= todayIndia;\n' +
'  });\n' +
'  // Compare cleaned yyyy-MM-dd strings, not the raw cell values — rows added\n' +
'  // by an outside automation can store Check-in as a real Date object while\n' +
'  // rows added through the app store it as force-text (\'2026-09-30);\n' +
'  // sorting the raw values mixes two incomparable formats and looks random.\n' +
'  // Sort newest-first to pick the 60 most relevant (recent/upcoming) rows,\n' +
'  // then flip to chronological order for display.\n' +
'  rows.sort(function (a, b) {\n' +
'    return cleanText(b[col[\'Check-in\']]).localeCompare(cleanText(a[col[\'Check-in\']]));\n' +
'  });\n' +
'  rows = rows.slice(0, 60).reverse();\n' +
'  return rows.map(function (row) {\n' +
'    return {\n' +
'      bookingNumber: cleanText(row[col[\'Booking Number\']]),\n' +
'      guestName: cleanText(row[col[\'Guest\']]),\n' +
'      checkIn: cleanText(row[col[\'Check-in\']]),\n' +
'      checkOut: cleanText(row[col[\'Check-out\']]),\n' +
'      remarks: cleanText(row[col[\'Remarks\']]),\n' +
'      guests: cleanText(row[col[\'Guests\']])\n' +
'    };\n' +
'  });\n' +
'}\n\n' +
'// Ledger dates/text are stored with a leading apostrophe (forces plain\n' +
'// text, see the Ledger\'s own script) — strip it back off, and format any\n' +
'// stray real Date cell the same way.\n' +
'function cleanText(val) {\n' +
'  if (val instanceof Date) return Utilities.formatDate(val, Session.getScriptTimeZone(), \'yyyy-MM-dd\');\n' +
'  var s = String(val == null ? \'\' : val);\n' +
'  return s.charAt(0) === "\'" ? s.slice(1) : s;\n' +
'}\n\n' +
'// Saves one uploaded file into Drive under\n' +
'// "Sindooram ID Vault/<Check-in date>/<Booking Number>/", and logs the\n' +
'// upload as a row in the Ledger Sheet\'s "ID Vault Uploads" tab so there\'s\n' +
'// a record of what\'s been collected, visible next to the bookings.\n' +
'function saveUpload(data) {\n' +
'  var bookingNumber = String(data.bookingNumber || \'\').trim() || \'Unlabeled\';\n' +
'  var checkInDate = String(data.checkInDate || \'\').trim() || \'Unknown date\';\n' +
'  var dateFolder = getOrCreateFolder(getVaultRootFolder(), checkInDate);\n' +
'  var folder = getOrCreateFolder(dateFolder, bookingNumber);\n\n' +
'  var bytes = Utilities.base64Decode(data.fileBase64);\n' +
'  var blob = Utilities.newBlob(bytes, data.mimeType || \'application/octet-stream\', data.fileName || \'upload\');\n' +
'  var stamp = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), \'yyyy-MM-dd_HHmmss\');\n' +
'  blob.setName(stamp + \'_\' + (data.fileName || \'upload\'));\n' +
'  var file = folder.createFile(blob);\n\n' +
'  logUpload(bookingNumber, data.guestName || \'\', checkInDate, data.comments || \'\', file.getName(), data.uploadedBy || \'\', file.getUrl());\n\n' +
'  return { status: \'ok\', fileUrl: file.getUrl(), folderUrl: folder.getUrl() };\n' +
'}\n\n' +
'// Undoes a mistaken upload from the same session: trashes the Drive file\n' +
'// and removes its row from the "ID Vault Uploads" log, matched by the\n' +
'// file\'s URL (the same value the app got back when it uploaded it).\n' +
'function deleteUpload(data) {\n' +
'  var fileUrl = String(data.fileUrl || \'\');\n' +
'  var m = fileUrl.match(/[-\\w]{25,}/);\n' +
'  if (!m) throw new Error(\'Could not identify the file to remove.\');\n' +
'  DriveApp.getFileById(m[0]).setTrashed(true);\n' +
'  removeUploadLogRow(fileUrl);\n' +
'  return { status: \'removed\' };\n' +
'}\n\n' +
'function removeUploadLogRow(fileUrl) {\n' +
'  var ss = SpreadsheetApp.openById(LEDGER_SHEET_ID);\n' +
'  var sheet = ss.getSheetByName(\'ID Vault Uploads\');\n' +
'  if (!sheet) return;\n' +
'  var values = sheet.getDataRange().getValues();\n' +
'  if (values.length < 2) return;\n' +
'  var headers = values[0];\n' +
'  var linkCol = headers.indexOf(\'File Link\');\n' +
'  if (linkCol === -1) return;\n' +
'  for (var i = values.length - 1; i >= 1; i--) {\n' +
'    if (values[i][linkCol] === fileUrl) {\n' +
'      sheet.deleteRow(i + 1);\n' +
'      break;\n' +
'    }\n' +
'  }\n' +
'}\n\n' +
'// Reads the "ID Vault Uploads" log and returns just the rows for one\n' +
'// booking, newest first — this is what lets the app show "documents on\n' +
'// file" for a booking even after leaving and coming back, or reloading.\n' +
'function getUploadsForBooking(bookingNumber) {\n' +
'  var ss = SpreadsheetApp.openById(LEDGER_SHEET_ID);\n' +
'  var sheet = ss.getSheetByName(\'ID Vault Uploads\');\n' +
'  if (!sheet) return [];\n' +
'  var values = sheet.getDataRange().getValues();\n' +
'  if (values.length < 2) return [];\n' +
'  var headers = values[0];\n' +
'  var col = {};\n' +
'  headers.forEach(function (h, i) { col[h] = i; });\n' +
'  var wanted = String(bookingNumber).trim();\n' +
'  var rows = values.slice(1).filter(function (row) {\n' +
'    return String(row[col[\'Booking Number\']] || \'\').trim() === wanted;\n' +
'  });\n' +
'  return rows.map(function (row) {\n' +
'    var uploadedAt = row[col[\'Uploaded At\']];\n' +
'    return {\n' +
'      fileName: String(row[col[\'File Name\']] || \'\'),\n' +
'      uploadedBy: String(row[col[\'Uploaded By\']] || \'\'),\n' +
'      uploadedAt: uploadedAt instanceof Date ? Utilities.formatDate(uploadedAt, Session.getScriptTimeZone(), \'dd MMM, h:mm a\') : String(uploadedAt || \'\'),\n' +
'      fileUrl: String(row[col[\'File Link\']] || \'\')\n' +
'    };\n' +
'  }).reverse();\n' +
'}\n\n' +
'function getVaultRootFolder() {\n' +
'  return getOrCreateFolder(DriveApp.getRootFolder(), VAULT_FOLDER_NAME);\n' +
'}\n\n' +
'function getOrCreateFolder(parent, name) {\n' +
'  var existing = parent.getFoldersByName(name);\n' +
'  if (existing.hasNext()) return existing.next();\n' +
'  return parent.createFolder(name);\n' +
'}\n\n' +
'function logUpload(bookingNumber, guestName, checkInDate, comments, fileName, uploadedBy, fileUrl) {\n' +
'  var ss = SpreadsheetApp.openById(LEDGER_SHEET_ID);\n' +
'  var sheet = ss.getSheetByName(\'ID Vault Uploads\') || ss.insertSheet(\'ID Vault Uploads\');\n' +
'  if (sheet.getLastRow() === 0) {\n' +
'    var headers = [\'Booking Number\', \'Guest Name\', \'Check-in\', \'Comments\', \'File Name\', \'Uploaded By\', \'Uploaded At\', \'File Link\'];\n' +
'    sheet.appendRow(headers);\n' +
'    sheet.getRange(1, 1, 1, headers.length).setFontWeight(\'bold\');\n' +
'  }\n' +
'  sheet.appendRow([bookingNumber, guestName, checkInDate, comments, fileName, uploadedBy, new Date(), fileUrl]);\n' +
'  sheet.autoResizeColumns(1, 8);\n' +
'}';

/* ---------- Utils ---------- */
function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function fmtShort(str){
  if(!str) return '';
  var d = new Date(str + 'T00:00:00');
  if(isNaN(d)) return str;
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short' });
}
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function ymd(y, m, d){ return y + '-' + pad2(m + 1) + '-' + pad2(d); }
function timeAgo(iso){
  var diff = Date.now() - new Date(iso).getTime();
  var min = Math.floor(diff/60000);
  if(min < 1) return 'just now';
  if(min < 60) return min + ' min ago';
  var hr = Math.floor(min/60);
  return hr + ' hr' + (hr>1?'s':'') + ' ago';
}

/* ---------- Sheet I/O ---------- */
function setConnStatus(status){
  connectionStatus = status;
  var el = document.getElementById('connStatus');
  if(!el) return;
  var map = {
    idle:{ cls:'off', text:'Not connected' },
    loading:{ cls:'syncing', text:'Loading…' },
    live:{ cls:'live', text:'Live' },
    syncing:{ cls:'syncing', text:'Working…' },
    error:{ cls:'error', text:'Offline — showing last saved copy' }
  };
  var m = map[status] || map.idle;
  el.innerHTML = '<span class="conn-dot conn-dot-' + m.cls + '"></span>' + m.text;
}
function loadFromSheet(silent){
  if(!state.settings.appsScriptUrl){ setConnStatus('idle'); return Promise.resolve(); }
  if(!silent) setConnStatus('loading');
  return fetch(state.settings.appsScriptUrl, { method:'GET' }).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function(data){
    state.bookings = Array.isArray(data.bookings) ? data.bookings : [];
    cacheLocally();
    lastLoadedAt = Date.now();
    setConnStatus('live');
    if(currentTab === 'bookings' || currentTab === 'calendar' || currentTab === 'settings') renderCurrentTab();
  }).catch(function(){
    setConnStatus('error');
    if(!silent) toast('Could not reach the Sheet');
  });
}
// Fetches the documents already on file for one booking, so opening a
// booking (even after a reload) shows what's been uploaded before —
// not just what's been uploaded in this browser session.
function loadBookingUploads(bookingNumber){
  if(!state.settings.appsScriptUrl || !bookingNumber) return Promise.resolve();
  bookingUploadsLoading = true;
  renderBookingUploadsList();
  var sep = state.settings.appsScriptUrl.indexOf('?') === -1 ? '?' : '&';
  var url = state.settings.appsScriptUrl + sep + 'bookingNumber=' + encodeURIComponent(bookingNumber);
  return fetch(url).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function(data){
    bookingUploadsLoading = false;
    if(!activeBooking || activeBooking.bookingNumber !== bookingNumber) return;
    bookingUploads = Array.isArray(data.uploads) ? data.uploads : [];
    renderBookingUploadsList();
  }).catch(function(){
    bookingUploadsLoading = false;
    if(activeBooking && activeBooking.bookingNumber === bookingNumber) renderBookingUploadsList();
  });
}

  return '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M8 12h8M12 8v8"/></svg>';
}
function notConnectedHTML(){
  return '<div class="empty-state">' +
    '<div class="empty-state-icon">' + connectIconSVG() + '</div>' +
    '<h3 class="card-title">Connect the Vault</h3>' +
    '<p class="empty-hint">Set up the Apps Script Web App URL in Settings to load bookings and save uploads.</p>' +
    '<button type="button" class="btn-primary" data-action="switch-tab" data-tab="settings">Go to Settings</button>' +
    '</div>';
}
function bookingCardHTML(b){
  return '<div class="booking-card" data-action="pick-booking" data-number="' + escapeHtml(b.bookingNumber) + '">' +
    '<div class="booking-card-top"><strong class="booking-guest">' + escapeHtml(b.guestName || 'Guest') + '</strong><span class="badge">#' + escapeHtml(b.bookingNumber) + '</span></div>' +
    '<div class="booking-dates">' + fmtShort(b.checkIn) + (b.checkOut ? ' → ' + fmtShort(b.checkOut) : '') + (b.guests ? ' &middot; ' + escapeHtml(String(b.guests)) + ' guest' + (String(b.guests)==='1'?'':'s') : '') + '</div>' +
    (b.remarks ? '<div class="booking-meta">' + escapeHtml(b.remarks) + '</div>' : '') +
  '</div>';
}
function renderBookings(){
  var el = document.getElementById('tab-bookings');
  if(!state.settings.appsScriptUrl){ el.innerHTML = notConnectedHTML(); return; }
  if(activeBooking){ renderBookingDetail(el); return; }
  var list = state.bookings.length ? state.bookings.map(bookingCardHTML).join('') : '<p class="empty-hint">No bookings found yet.</p>';
  el.innerHTML = '<p class="empty-hint" style="margin-bottom:12px;">Tap a booking to upload documents for it.</p><div class="booking-list">' + list + '</div>';
}
function renderBookingDetail(el){
  var b = activeBooking;

  el.innerHTML =
    '<button type="button" class="btn-secondary" data-action="back-to-bookings" style="margin-bottom:12px;">&larr; Back to bookings</button>' +
    '<div class="card">' +
      nameNotice +
      '<div class="detail-row"><span class="detail-label">Guest name</span><span class="detail-value">' + escapeHtml(b.guestName || '—') + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">Booking number</span><span class="detail-value">#' + escapeHtml(b.bookingNumber) + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">Check-in</span><span class="detail-value">' + fmtShort(b.checkIn) + '</span></div>' +
      (b.checkOut ? '<div class="detail-row"><span class="detail-label">Check-out</span><span class="detail-value">' + fmtShort(b.checkOut) + '</span></div>' : '') +
      (b.guests ? '<div class="detail-row"><span class="detail-label">No. of guests</span><span class="detail-value">' + escapeHtml(String(b.guests)) + '</span></div>' : '') +
      (b.remarks ? '<div class="detail-row"><span class="detail-label">Remarks</span><span class="detail-value">' + escapeHtml(b.remarks) + '</span></div>' : '') +

    '</div>' +
    '<div class="card"><h3 class="card-title">Documents on file<span id="bookingUploadsCount"></span></h3><div class="upload-list" id="bookingUploadsList"></div></div>' +
    '<div class="card">' +
      '<div class="upload-actions">' +
        '<button type="button" class="upload-btn" data-action="take-photo">' + uploadIconSVG() + 'Take Photo</button>' +
        '<button type="button" class="upload-btn" data-action="choose-file">' + fileIconSVG() + 'Choose Photos</button>' +
        '<button type="button" class="upload-btn" data-action="choose-doc">' + fileIconSVG() + 'Choose Document</button>' +
      '</div>' +
      '<h3 class="card-title">Ready to upload</h3><div class="upload-list" id="pendingFilesList"></div>' +
      '<button type="button" class="btn-primary" id="uploadSubmitBtn" data-action="submit-uploads" style="width:100%;margin-top:12px;">Submit</button>' +
    '</div>' +
    '<div class="card"><h3 class="card-title">Uploaded this session</h3><div class="upload-list" id="sessionUploadsList"></div></div>';

  renderPendingList();
  renderSessionUploads();
  renderBookingUploadsList();
}
// Shows documents already on file for this booking (fetched from the
// Sheet), independent of anything uploaded in the current session — this
// is what stays visible after leaving and coming back, or reloading.
function renderBookingUploadsList(){
  var el = document.getElementById('bookingUploadsList');
  var countEl = document.getElementById('bookingUploadsCount');
  if(!el) return;
  if(countEl) countEl.textContent = bookingUploads.length ? (' (' + bookingUploads.length + ')') : '';
  if(bookingUploadsLoading){ el.innerHTML = '<p class="empty-hint">Checking what\'s already been uploaded…</p>'; return; }
  el.innerHTML = bookingUploads.length ? bookingUploads.map(function(u){
    var meta = (u.uploadedBy ? 'by ' + u.uploadedBy : '') + (u.uploadedBy && u.uploadedAt ? ' · ' : '') + (u.uploadedAt || '');
    return '<div class="upload-row"><span class="name">' + escapeHtml(u.fileName) + '</span>' +
      (u.fileUrl ? '<a class="view-link" href="' + escapeHtml(u.fileUrl) + '" target="_blank" rel="noopener">View</a>' : '') +
      (meta ? '<span class="upload-meta">' + escapeHtml(meta) + '</span>' : '') +
      '</div>';
  }).join('') : '<p class="empty-hint">No documents uploaded for this booking yet.</p>';
}
function renderPendingList(){
  var listEl = document.getElementById('pendingFilesList');
  var btn = document.getElementById('uploadSubmitBtn');
  if(!listEl || !btn) return;
  listEl.innerHTML = pendingFiles.length ? pendingFiles.map(function(p){
    var viewLink = p.previewUrl ? ('<a class="view-link" href="' + p.previewUrl + '" target="_blank" rel="noopener">View</a>') : '';
    return '<div class="upload-row"><span class="name">' + escapeHtml(p.file.name) + '</span>' + viewLink + '<button type="button" class="remove-pending-btn" data-action="remove-pending" data-id="' + p.id + '">Remove</button></div>';
  }).join('') : '<p class="empty-hint">Nothing selected yet — tap Take Photo, Choose Photos, or Choose Document above.</p>';
  btn.disabled = pendingFiles.length === 0;
  btn.textContent = pendingFiles.length ? ('Submit ' + pendingFiles.length + ' file' + (pendingFiles.length > 1 ? 's' : '')) : 'Submit';
}
function renderSessionUploads(){
  var el = document.getElementById('sessionUploadsList');
  if(!el) return;
  el.innerHTML = sessionUploads.length ? sessionUploads.map(function(u){
    var cls = u.status === 'done' ? 'done' : (u.status === 'failed' ? 'failed' : (u.status === 'removing' ? 'uploading' : 'uploading'));
    var label = u.status === 'done' ? 'Uploaded' : (u.status === 'failed' ? 'Failed' : (u.status === 'removing' ? 'Removing…' : 'Uploading…'));
    var viewLink = (u.status === 'done' && u.url) ? '<a class="view-link" href="' + escapeHtml(u.url) + '" target="_blank" rel="noopener">View</a>' : '';
    var removeBtn = (u.status === 'done' || u.status === 'failed') ? '<button type="button" class="remove-pending-btn" data-action="remove-uploaded" data-id="' + u.id + '">Remove</button>' : '';
    return '<div class="upload-row"><span class="name">' + escapeHtml(u.name) + '</span>' + viewLink + '<span class="upload-status ' + cls + '">' + label + '</span>' + removeBtn + '</div>';
  }).join('') : '<p class="empty-hint">Nothing uploaded yet this session.</p>';
}

/* ---------- Calendar tab ---------- */
var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function renderCalendar(){
  var el = document.getElementById('tab-calendar');
  if(!state.settings.appsScriptUrl){ el.innerHTML = notConnectedHTML(); return; }

  var byDate = {};
  state.bookings.forEach(function(b){
    if(!b.checkIn) return;
    (byDate[b.checkIn] = byDate[b.checkIn] || []).push(b);
  });

  var today = new Date();
  var todayStr = ymd(today.getFullYear(), today.getMonth(), today.getDate());
  var daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
  var startWeekday = new Date(calendarYear, calendarMonth, 1).getDay();

  var cells = '';
  for(var i = 0; i < startWeekday; i++) cells += '<div class="cal-day empty"></div>';
  for(var d = 1; d <= daysInMonth; d++){
    var dateStr = ymd(calendarYear, calendarMonth, d);
    var has = byDate[dateStr] && byDate[dateStr].length;
    var cls = 'cal-day' + (has ? ' has-booking' : '') + (dateStr === todayStr ? ' today' : '') + (dateStr === calendarSelectedDate ? ' selected' : '');
    cells += '<div class="' + cls + '" data-action="cal-pick-day" data-date="' + dateStr + '">' + d + (has ? '<span class="cal-dot"></span>' : '') + '</div>';
  }
  var weekdaysHTML = ['S','M','T','W','T','F','S'].map(function(w){ return '<div class="cal-weekday">' + w + '</div>'; }).join('');

  var listHTML = '';
  if(calendarSelectedDate){
    var dayBookings = byDate[calendarSelectedDate] || [];
    listHTML = '<div class="cal-day-list"><h3 class="card-title">Check-ins &mdash; ' + fmtShort(calendarSelectedDate) + '</h3>' +
      (dayBookings.length ? dayBookings.map(bookingCardHTML).join('') : '<p class="empty-hint">No check-ins this day.</p>') +
      '</div>';
  }

  el.innerHTML = '<div class="card">' +
    '<div class="cal-header">' +
      '<button type="button" class="cal-nav-btn" data-action="cal-prev" aria-label="Previous month">&lsaquo;</button>' +
      '<span class="cal-title">' + MONTH_NAMES[calendarMonth] + ' ' + calendarYear + '</span>' +
      '<button type="button" class="cal-nav-btn" data-action="cal-next" aria-label="Next month">&rsaquo;</button>' +
    '</div>' +
    '<div class="cal-grid">' + weekdaysHTML + cells + '</div>' +
    listHTML +
  '</div>';
}

/* ---------- Upload logic ---------- */
function fileToBase64(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(String(reader.result).split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function addPendingFile(file){
  if(!file) return;
  var previewUrl = '';
  try{ previewUrl = URL.createObjectURL(file); }catch(err){}
  pendingFiles.push({ id: 'p' + (++pendingIdCounter), file: file, previewUrl: previewUrl });
  renderPendingList();
}
function removePendingFile(id){
  var target = pendingFiles.find(function(p){ return p.id === id; });
  if(target && target.previewUrl) URL.revokeObjectURL(target.previewUrl);
  pendingFiles = pendingFiles.filter(function(p){ return p.id !== id; });
  renderPendingList();
}
// Removes an already-uploaded file: if it made it to Drive (status 'done'),
// asks the backend to trash it and drop its log row first; a 'failed' entry
// has nothing on Drive to clean up, so it's just dropped from the list.
function removeUploadedFile(id){
  var entry = sessionUploads.find(function(u){ return u.id === id; });
  if(!entry) return;
  if(entry.status !== 'done' || !entry.url){
    sessionUploads = sessionUploads.filter(function(u){ return u.id !== id; });
    renderSessionUploads();
    return;
  }
  entry.status = 'removing';
  renderSessionUploads();
  fetch(state.settings.appsScriptUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:'deleteUpload', fileUrl: entry.url })
  }).then(function(res){ return res.json(); }).then(function(result){
    if(result && result.error) throw new Error(result.error);
    sessionUploads = sessionUploads.filter(function(u){ return u.id !== id; });
    renderSessionUploads();
    toast('Removed');
    if(activeBooking) loadBookingUploads(activeBooking.bookingNumber);
  }).catch(function(){
    entry.status = 'done';
    renderSessionUploads();
    toast('Could not remove — try again');
  });
}
function uploadOneFile(file, meta){
  return fileToBase64(file).then(function(base64){
    return fetch(state.settings.appsScriptUrl, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({
        bookingNumber: meta.bookingNumber,
        guestName: meta.guestName,
        checkInDate: meta.checkInDate,
        comments: meta.comments,
        fileName: file.name,
        mimeType: file.type || 'application/octet-stream',
        fileBase64: base64,
        uploadedBy: meta.uploadedBy
      })
    });
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  });
}
function submitUploads(){
  if(!state.settings.appsScriptUrl){ toast('Connect in Settings first'); return; }
  if(!activeBooking){ toast('Pick a booking first'); return; }
  var managerName = state.settings.managerName || '';
  if(!managerName){ toast('Set your name in Settings first'); return; }
  if(pendingFiles.length === 0){ toast('Add at least one file first'); return; }
  var confirmMsg = 'Upload ' + pendingFiles.length + ' file' + (pendingFiles.length > 1 ? 's' : '') +
    ' for booking #' + activeBooking.bookingNumber + ' (' + (activeBooking.guestName || 'guest') + ')?';
  showConfirm(confirmMsg, 'Upload').then(function(ok){
    if(ok) doSubmitUploads();
  });
}
function doSubmitUploads(){
  var commentsInput = document.getElementById('uploadComments');
  var comments = commentsInput ? commentsInput.value.trim() : '';

  var meta = { bookingNumber: activeBooking.bookingNumber, guestName: activeBooking.guestName || '', checkInDate: activeBooking.checkIn || '', comments: comments, uploadedBy: state.settings.managerName || '' };
  var toSubmit = pendingFiles.slice();
  pendingFiles = [];
  renderPendingList();

  var submitBtn = document.getElementById('uploadSubmitBtn');
  if(submitBtn) submitBtn.disabled = true;
  setConnStatus('syncing');

  var entries = toSubmit.map(function(p){
    var entry = { id: 's' + (++sessionUploadIdCounter), name: p.file.name, status:'uploading' };
    sessionUploads.unshift(entry);
    return { file: p.file, entry: entry };
  });
  renderSessionUploads();

  var chain = Promise.resolve();
  entries.forEach(function(pair){
    chain = chain.then(function(){
      return uploadOneFile(pair.file, meta).then(function(result){
        pair.entry.status = 'done';
        pair.entry.url = result && result.fileUrl;
        renderSessionUploads();
      }).catch(function(){
        pair.entry.status = 'failed';
        renderSessionUploads();
      });
    });
  });
  chain.then(function(){
    toSubmit.forEach(function(p){ if(p.previewUrl) URL.revokeObjectURL(p.previewUrl); });
    var doneCount = entries.filter(function(pair){ return pair.entry.status === 'done'; }).length;
    var failedCount = entries.length - doneCount;
    setConnStatus(failedCount ? 'error' : 'live');
    var msg = failedCount === 0
      ? (doneCount + ' file' + (doneCount > 1 ? 's' : '') + ' uploaded — view them under "Documents on file"')
      : (doneCount + ' uploaded, ' + failedCount + ' failed — try the failed ones again');
    toast(msg);
    renderPendingList();
    if(activeBooking) loadBookingUploads(activeBooking.bookingNumber);
  });
}

/* ---------- Settings actions ---------- */
function saveSettingsFromForm(){
  state.settings.managerName = document.getElementById('settingsManagerName').value.trim();
  var newUrl = document.getElementById('appsScriptUrlInput').value.trim();
  state.settings.appsScriptUrl = newUrl;
  saveSettings();
  toast('Settings saved');
  if(state.settings.appsScriptUrl) loadFromSheet(false);
  else { setConnStatus('idle'); renderCurrentTab(); }
}
function copyScript(){
  var text = document.getElementById('scriptCode') ? document.getElementById('scriptCode').textContent : APPS_SCRIPT_CODE;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('Script copied'); }).catch(function(){ toast('Could not copy — select manually'); });
  }else{
    toast('Could not copy — select manually');
  }
}

/* ---------- Global click delegation ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  switch(action){
    case 'switch-tab': switchTab(el.dataset.tab); break;
    case 'refresh-now': loadFromSheet(false).then(function(){ toast('Refreshed'); }); break;
    case 'save-settings': saveSettingsFromForm(); break;
    case 'copy-script': copyScript(); break;
    case 'take-photo':
      if(!state.settings.appsScriptUrl){ toast('Connect in Settings first'); break; }
      document.getElementById('cameraInput').click();
      break;
    case 'choose-file':
      if(!state.settings.appsScriptUrl){ toast('Connect in Settings first'); break; }
      document.getElementById('fileInput').click();
      break;
    case 'choose-doc':
      if(!state.settings.appsScriptUrl){ toast('Connect in Settings first'); break; }
      document.getElementById('docInput').click();
      break;
    case 'remove-pending':
      var pf = pendingFiles.find(function(p){ return p.id === el.dataset.id; });
      if(pf){
        var pid = el.dataset.id;
        showConfirm('Remove "' + pf.file.name + '" from this upload?', 'Remove').then(function(ok){
          if(ok) removePendingFile(pid);
        });
      }
      break;
    case 'remove-uploaded':
      var su = sessionUploads.find(function(u){ return u.id === el.dataset.id; });
      if(!su) break;
      var removeMsg = su.status === 'done'
        ? 'Remove "' + su.name + '"? This deletes it from Drive too.'
        : 'Remove "' + su.name + '" from the list?';
      var uid = el.dataset.id;
      showConfirm(removeMsg, 'Remove').then(function(ok){
        if(ok) removeUploadedFile(uid);
      });
      break;
    case 'submit-uploads':
      submitUploads();
      break;
    case 'confirm-yes':
      closeConfirm(true);
      break;
    case 'confirm-cancel':
      closeConfirm(false);
      break;
    case 'pick-booking':
      var b = state.bookings.find(function(x){ return x.bookingNumber === el.dataset.number; });
      if(b){
        activeBooking = b;
        pendingFiles = [];
        bookingUploads = [];
        switchTab('bookings');
        loadBookingUploads(b.bookingNumber);
      }
      break;
    case 'cal-prev':
      calendarMonth--;
      if(calendarMonth < 0){ calendarMonth = 11; calendarYear--; }
      calendarSelectedDate = null;
      renderCalendar();
      break;
    case 'cal-next':
      calendarMonth++;
      if(calendarMonth > 11){ calendarMonth = 0; calendarYear++; }
      calendarSelectedDate = null;
      renderCalendar();
      break;
    case 'cal-pick-day':
      calendarSelectedDate = (calendarSelectedDate === el.dataset.date) ? null : el.dataset.date;
      renderCalendar();
      break;
    case 'back-to-bookings':
      activeBooking = null;
      pendingFiles = [];
      renderBookings();
      break;
    case 'open-tour':
      openTour();
      break;
    case 'tour-skip':
      closeTour();
      break;
    case 'tour-next':
      if(tourIndex === TOUR_STEPS[tourLang].length - 1){ closeTour(); }
      else { tourIndex++; renderTourStep(); }
      break;
    case 'tour-lang':
      tourLang = el.dataset.lang;
      renderTourStep();
      break;
  }
});

/* ---------- Init ---------- */
function init(){
  loadState();
  document.getElementById('cameraInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(file) addPendingFile(file);
    else toast('No photo captured');
    e.target.value = '';
  });
  document.getElementById('fileInput').addEventListener('change', function(e){
    var files = e.target.files;
    var count = files.length;
    for(var i = 0; i < count; i++) addPendingFile(files[i]);
    toast(count ? ('Added ' + count + ' photo' + (count > 1 ? 's' : '') + ' — see Ready to upload') : 'No photos were selected');
    e.target.value = '';
  });
  document.getElementById('docInput').addEventListener('change', function(e){
    var files = e.target.files;
    var count = files.length;
    for(var i = 0; i < count; i++) addPendingFile(files[i]);
    toast(count ? ('Added ' + count + ' document' + (count > 1 ? 's' : '') + ' — see Ready to upload') : 'No documents were selected');
    e.target.value = '';
  });
  setConnStatus(state.settings.appsScriptUrl ? 'loading' : 'idle');
  switchTab('bookings');
  if(state.settings.appsScriptUrl) loadFromSheet(false);
  try{
    if(!localStorage.getItem('idvault_tour_seen_v1')){ setTimeout(openTour, 500); }
  }catch(e){}
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

}
function onBookingStatusChange(){
  var status = getComboValue(bookingStatusSel, bookingStatusOther);
  if((status === 'Confirmed-Advance' || status === 'Confirmed-Paid') && !bookingNumberInput.value.trim()){
    bookingNumberInput.value = nextBookingNumber();
  }
  updateReceiptSectionVisibility();
}
function defaultReceiptAmount(){
  var status = getComboValue(bookingStatusSel, bookingStatusOther);
  var total = parseFloat(bookingAmountInput.value) || 0;
  return status === 'Confirmed-Paid' ? total : Math.round(total / 2 * 100) / 100;
}
function postAction(payload){
  return fetch(state.settings.appsScriptUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  });
}
function previewReceipt(){
  if(!state.settings.appsScriptUrl){ toast('Connect your Google Sheet first'); return; }
  if(!bookingIdInput.value){ toast('Save the booking first'); return; }
  if(!guestEmailInput.value.trim()){ toast('Add a guest email first'); return; }
  var payload = {
    action:'previewReceipt',
    bookingId: bookingIdInput.value,
    amountReceived: parseFloat(receiptAmountReceived.value) || 0,
    receivedDate: receiptReceivedDate.value,
    rateIncludes: receiptRateIncludes.value.trim()
  };
  receiptPreviewStatus.textContent = 'Generating…';
  receiptPreviewStatus.style.display = 'block';
  viewReceiptPdfBtn.style.display = 'none';
  receiptPdfFrame.src = 'about:blank';
  receiptEmailTo.textContent = '';
  receiptEmailSubject.textContent = '';
  receiptEmailBody.textContent = '';
  sendReceiptBtn.disabled = true;
  showModal(receiptPreviewOverlay);
  postAction(payload).then(function(res){
    if(res.error) throw new Error(res.error);
    receiptPreviewStatus.style.display = 'none';
    receiptPdfFrame.src = 'data:application/pdf;base64,' + res.pdfBase64;
    viewReceiptPdfBtn.style.display = 'block';
    receiptEmailTo.textContent = res.toEmail || '(no email on file)';
    receiptEmailSubject.textContent = res.subject;
    receiptEmailBody.textContent = res.bodyText;
    sendReceiptBtn.disabled = !res.toEmail;
    receiptLastPayload = payload;
    showModal(receiptPdfOverlay);
  }).catch(function(err){
    receiptPreviewStatus.style.display = 'block';
    receiptPreviewStatus.textContent = 'Could not generate receipt: ' + err.message;
  });
}
function sendReceiptNow(){
  if(!receiptLastPayload) return;
  sendReceiptBtn.disabled = true;
  sendReceiptBtn.textContent = 'Sending…';
  postAction(Object.assign({}, receiptLastPayload, { action:'sendReceipt' })).then(function(res){
    if(res.error) throw new Error(res.error);
    toast('Receipt sent');
    hideModal(receiptPreviewOverlay);
  }).catch(function(err){
    toast('Could not send: ' + err.message);
    sendReceiptBtn.disabled = false;
  }).then(function(){
    sendReceiptBtn.textContent = 'Send email';
  });
}

/* ---------- Global click delegation ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  switch(action){
    case 'switch-tab': switchTab(el.dataset.tab); break;
    case 'set-gran': dashGran = el.dataset.gran; dashOffset = 0; renderDashboard(); break;
    case 'period-prev': dashOffset -= 1; renderDashboard(); break;
    case 'period-next': dashOffset += 1; renderDashboard(); break;
    case 'edit-txn': openTxnModal(el.dataset.id); break;
    case 'close-txn-modal': hideModal(txnModalOverlay); break;
    case 'delete-txn-from-modal': if(txnId.value){ deleteTxn(txnId.value); hideModal(txnModalOverlay); } break;
    case 'rename-category': renameCategoryPrompt(); break;
    case 'rename-subcategory': renameSubcategoryPrompt(); break;
    case 'rename-booking-status': renameBookingStatusPrompt(); break;
    case 'set-booking-filter': bookingsFilter = el.dataset.filter; renderBookings(); break;
    case 'edit-booking': openBookingModal(el.dataset.id); break;
    case 'delete-txn-from-row': deleteTxn(el.dataset.id); break;
    case 'delete-booking-from-row': deleteBooking(el.dataset.id); break;
    case 'close-booking-modal': hideModal(bookingModalOverlay); break;
    case 'delete-booking-from-modal': if(bookingIdInput.value){ deleteBooking(bookingIdInput.value); hideModal(bookingModalOverlay); } break;
    case 'save-settings': saveSettingsFromForm(); break;
    case 'refresh-now': loadFromSheet(false).then(function(){ toast('Refreshed'); }); break;
    case 'start-tour': startTour(); break;
    case 'tour-next': nextTourStep(); break;
    case 'tour-back': prevTourStep(); break;
    case 'tour-skip': endTour(); break;
    case 'export-data': exportData(); break;
    case 'send-report-now': sendReportNow(); break;
    case 'copy-script': copyScript(); break;
    case 'preview-receipt': previewReceipt(); break;
    case 'close-receipt-preview': hideModal(receiptPreviewOverlay); break;
    case 'view-receipt-pdf': showModal(receiptPdfOverlay); break;
    case 'close-receipt-pdf': hideModal(receiptPdfOverlay); break;
    case 'send-receipt': sendReceiptNow(); break;
  }
});

/* ---------- Init ---------- */
function init(){
  loadState();

  txnModalOverlay = document.getElementById('txnModalOverlay');
  txnForm = document.getElementById('txnForm');
  txnId = document.getElementById('txnId');
  txnDate = document.getElementById('txnDate');
  txnCategory = document.getElementById('txnCategory');
  txnCategoryOther = document.getElementById('txnCategoryOther');
  txnSubcategory = document.getElementById('txnSubcategory');
  txnSubcategoryOther = document.getElementById('txnSubcategoryOther');
  txnRecurrence = document.getElementById('txnRecurrence');
  txnRecurrenceOther = document.getElementById('txnRecurrenceOther');
  txnEndsOn = document.getElementById('txnEndsOn');
  txnDescription = document.getElementById('txnDescription');
  txnAmount = document.getElementById('txnAmount');
  txnAddedBy = document.getElementById('txnAddedBy');
  txnDeleteBtn = document.getElementById('txnDeleteBtn');
  txnModalTitle = document.getElementById('txnModalTitle');

  bookingModalOverlay = document.getElementById('bookingModalOverlay');
  bookingForm = document.getElementById('bookingForm');
  bookingIdInput = document.getElementById('bookingId');
  bookingNumberInput = document.getElementById('bookingNumber');
  guestNameInput = document.getElementById('guestName');
  guestEmailInput = document.getElementById('guestEmail');
  guestPhoneInput = document.getElementById('guestPhone');
  bookingGuestsInput = document.getElementById('bookingGuests');
  checkInInput = document.getElementById('checkIn');
  checkOutInput = document.getElementById('checkOut');
  bookingSourceSel = document.getElementById('bookingSource');
  bookingAmountInput = document.getElementById('bookingAmount');
  bookingStatusSel = document.getElementById('bookingStatus');
  bookingStatusOther = document.getElementById('bookingStatusOther');
  bookingRemarksInput = document.getElementById('bookingRemarks');
  bookingAddedByInput = document.getElementById('bookingAddedBy');
  bookingDeleteBtn = document.getElementById('bookingDeleteBtn');
  bookingModalTitle = document.getElementById('bookingModalTitle');

  bookingSourceSel.innerHTML = BOOKING_SOURCES.map(function(s){ return '<option value="'+escapeHtml(s)+'">'+escapeHtml(s)+'</option>'; }).join('');
  wireCombo(bookingStatusSel, bookingStatusOther, onBookingStatusChange);

  receiptSection = document.getElementById('receiptSection');
  receiptAmountReceived = document.getElementById('receiptAmountReceived');
  receiptReceivedDate = document.getElementById('receiptReceivedDate');
  receiptRateIncludes = document.getElementById('receiptRateIncludes');
  receiptPreviewOverlay = document.getElementById('receiptPreviewOverlay');
  receiptPdfOverlay = document.getElementById('receiptPdfOverlay');
  receiptPdfFrame = document.getElementById('receiptPdfFrame');
  viewReceiptPdfBtn = document.getElementById('viewReceiptPdfBtn');
  receiptPreviewStatus = document.getElementById('receiptPreviewStatus');
  receiptEmailTo = document.getElementById('receiptEmailTo');
  receiptEmailSubject = document.getElementById('receiptEmailSubject');
  receiptEmailBody = document.getElementById('receiptEmailBody');
  sendReceiptBtn = document.getElementById('sendReceiptBtn');
  bookingSourceSel.addEventListener('change', onBookingSourceChange);
  receiptPreviewOverlay.addEventListener('click', function(e){ if(e.target === receiptPreviewOverlay) hideModal(receiptPreviewOverlay); });
  receiptPdfOverlay.addEventListener('click', function(e){ if(e.target === receiptPdfOverlay) hideModal(receiptPdfOverlay); });

  document.getElementById('fabAdd').addEventListener('click', function(){
    if(!state.settings.appsScriptUrl){ toast('Connect your Google Sheet in Settings first'); switchTab('settings'); return; }
    if(currentTab === 'bookings') openBookingModal(); else openTxnModal();
  });

  wireCombo(txnCategory, txnCategoryOther, function(){ updateSubcategoryOptions(''); });
  txnCategoryOther.addEventListener('input', function(){ updateSubcategoryOptions(''); });
  wireCombo(txnSubcategory, txnSubcategoryOther, null);
  wireCombo(txnRecurrence, txnRecurrenceOther, null);

  txnModalOverlay.addEventListener('click', function(e){ if(e.target === txnModalOverlay) hideModal(txnModalOverlay); });
  bookingModalOverlay.addEventListener('click', function(e){ if(e.target === bookingModalOverlay) hideModal(bookingModalOverlay); });

  txnForm.addEventListener('submit', function(e){
    e.preventDefault();
    var type = currentTxnModalType;
    var id = txnId.value || uid('t_');
    var existing = txnId.value ? state.transactions.find(function(t){ return t.id === id; }) : null;
    var txn = {
      id:id, type:type,
      date: txnDate.value,
      category: getComboValue(txnCategory, txnCategoryOther),
      subcategory: getComboValue(txnSubcategory, txnSubcategoryOther),
      recurrence: getComboValue(txnRecurrence, txnRecurrenceOther) || 'One-off',
      endsOn: txnEndsOn.value || '',
      description: txnDescription.value.trim(),
      amount: parseFloat(txnAmount.value) || 0,
      addedBy: txnAddedBy.value.trim() || state.settings.userName || 'Unknown',
      createdAt: existing ? existing.createdAt : new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    hideModal(txnModalOverlay);
    toast('Saving…');
    mutateAndSync(function(latest){
      var list = latest.transactions.slice();
      var idx = list.findIndex(function(t){ return t.id === id; });
      if(idx >= 0) list[idx] = txn; else list.push(txn);
      return { transactions:list, bookings: latest.bookings };
    }).then(function(){ toast('Saved'); }).catch(function(){});
  });

  bookingForm.addEventListener('submit', function(e){
    e.preventDefault();
    var id = bookingIdInput.value || uid('b_');
    var existing = bookingIdInput.value ? state.bookings.find(function(b){ return b.id === id; }) : null;
    var booking = {
      id:id,
      bookingNumber: bookingNumberInput.value.trim(),
      guestName: guestNameInput.value.trim(),
      guestEmail: guestEmailInput.value.trim(),
      guestPhone: guestPhoneInput.value.trim(),
      guests: parseInt(bookingGuestsInput.value, 10) || 0,
      checkIn: checkInInput.value,
      checkOut: checkOutInput.value,
      source: bookingSourceSel.value,
      amount: parseFloat(bookingAmountInput.value) || 0,
      status: getComboValue(bookingStatusSel, bookingStatusOther),
      remarks: bookingRemarksInput.value.trim(),
      addedBy: bookingAddedByInput.value.trim() || state.settings.userName || 'Unknown',
      createdAt: existing ? existing.createdAt : new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    hideModal(bookingModalOverlay);
    toast('Saving…');
    mutateAndSync(function(latest){
      var list = latest.bookings.slice();
      var idx = list.findIndex(function(b){ return b.id === id; });
      if(idx >= 0) list[idx] = booking; else list.push(booking);
      return { transactions: latest.transactions, bookings: list };
    }).then(function(){ toast('Saved'); }).catch(function(){});
  });

  setConnStatus(state.settings.appsScriptUrl ? 'loading' : 'idle');
  switchTab('dashboard');
  if(state.settings.appsScriptUrl){
    loadFromSheet(false);
    startPolling();
  }
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
